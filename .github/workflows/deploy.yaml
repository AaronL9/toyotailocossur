name: Build and Push to Production

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: 24.14.0
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      # Use an allow-list: only copy what production actually needs
      - name: Prepare deploy files
        run: |
          mkdir deploy
          rsync -av \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.github' \
            --exclude='resources' \
            --exclude='Dockerfile' \
            --exclude='.dockerignore' \
            --exclude='compose.yml' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='vite.config.js' \
            --exclude='tsconfig.json' \
            ./ deploy/

          # Ensure dist is tracked even if listed in .gitignore
          printf '\n!dist\n!dist/**\n' >> deploy/.gitignore

      - name: Push to production branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd deploy
          git init
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote add origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git

          # Fetch production if it already exists (ignore error on first run)
          git fetch origin production 2>/dev/null || true

          # If production exists remotely, reset to it so the histories align;
          # on first run this is a no-op (the || true handles the missing ref)
          git reset --soft origin/production 2>/dev/null || true

          git checkout -b production
          git add .

          # Skip the push if there's nothing new to deploy
          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi

          git commit -m "Deploy from main @ ${{ github.sha }}"
          git push --force origin production
